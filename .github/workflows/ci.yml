name: TraceForge verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: pytest backend
      - run: cd backend && python benchmark.py > ../benchmark-results.json
      - uses: actions/upload-artifact@v4
        with: {name: benchmark, path: benchmark-results.json}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
  end-to-end:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      ADMIN_PASSWORD: ci-only-admin-password
      INGEST_KEY: ci-only-ingest-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: docker compose up --build -d --wait
      - run: docker compose run --rm workload python workload.py --count 30
      - run: cd web && npm ci && npx playwright install --with-deps chromium && npm run test:e2e
      - run: python scripts/benchmark_pipeline.py
      - uses: actions/upload-artifact@v4
        with: {name: pipeline-benchmark, path: pipeline-benchmark-results.json}
      - if: always()
        run: docker compose logs > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: integration-logs, path: compose.log}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: browser-evidence, path: web/test-results}
      - if: always()
        run: docker compose down -v
